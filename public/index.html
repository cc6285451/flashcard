<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闪卡学习系统 - 极速版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <h2>卡片分组</h2>
            <div id="group-buttons-container">
                </div>
        </aside>

        <main class="content">
            <div class="controls">
                <div class="select-group">
                    <label>难度：</label>
                    <select id="difficulty-select">
                        <option value="1">难度 1</option>
                        <option value="2">难度 2</option>
                        <option value="3">难度 3</option>
                        <option value="4">难度 4</option>
                        <option value="5">难度 5</option>
                        <option value="6">难度 6</option>
                        <option value="7">难度 7</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>模式：</label>
                    <select id="mode-select">
                        <option value="study">顺序学习 (自动播放)</option>
                        <option value="test">乱序测试 (手动播放)</option>
                    </select>
                </div>
            </div>

            <div class="card-display">
                <div class="image-container">
                    <img id="flashcard-image" src="" alt="点击图片播放声音">
                </div>
                <audio id="flashcard-audio"></audio>
                <button id="next-button">下一张</button>
                <div id="card-status"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
